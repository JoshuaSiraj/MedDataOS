[workspace]
authors = ["Joshua Siraj <joshua.siraj@ryerson.ca>"]
channels = ["conda-forge"]
name = "MedDataOS"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.13,<3.14"

[pypi-dependencies]
meddataos = { path = ".", editable = true, extras = ["dev"] }
med-datactrl = { git = "https://github.com/pmcdi/med-datactrl.git", branch = "alhusains/feat/clinical-notes-agent" }

[tasks]
serve = "python web/backend/server.py"
agent = "python examples/agent.py"
test = "pytest tests"
